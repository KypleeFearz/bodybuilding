spring:
  application:
    name: bodybuilding
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bodybuilding}
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # The decoder is created lazily, so the app starts without network access to Auth0.
          issuer-uri: https://${AUTH0_DOMAIN:example.eu.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://bodybuilding-api}
  # Mail is optional. Set SPRING_MAIL_HOST (plus username/password) to enable notifications.
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  auth:
    domain: ${AUTH0_DOMAIN:}
    client-id: ${AUTH0_CLIENT_ID:}
    audience: ${AUTH0_AUDIENCE:https://bodybuilding-api}
    # Namespace of the custom claims added by the Auth0 post-login action (roles, name, email).
    claim-namespace: ${AUTH0_CLAIM_NAMESPACE:https://bodybuilding.app/}
  mail:
    from: ${MAIL_FROM:no-reply@bodybuilding.local}
  seed-demo-data: ${SEED_DEMO_DATA:false}
